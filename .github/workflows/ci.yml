name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-web:
    name: Backend + Web (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pathpulse_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/pathpulse_ci
      DATABASE_URL: postgres://postgres:ci@localhost:5432/pathpulse_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile ${{ github.event.pull_request.head.repo.fork && '--ignore-scripts' || '' }}
      - name: Typecheck (all workspaces)
        run: pnpm run typecheck
      - name: Build (all workspaces)
        run: pnpm run build
      - name: Test
        run: pnpm run test

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    # Enabled once android/ has a Gradle project (Phase 1, Daiwik).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: ${{ hashFiles('android/settings.gradle', 'android/settings.gradle.kts') != '' }}
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        if: ${{ hashFiles('android/settings.gradle', 'android/settings.gradle.kts') != '' }}
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

  ios:
    name: iOS (Swift)
    runs-on: macos-26
    # Enabled once ios/ has an Xcode project (Phase 1, Daiwik).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate Xcode project
        if: ${{ hashFiles('ios/project.yml') != '' }}
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Build
        if: ${{ hashFiles('ios/**/*.xcodeproj/project.pbxproj') != '' }}
        working-directory: ios
        run: xcodebuild -scheme PathPulse -destination 'generic/platform=iOS Simulator' build
